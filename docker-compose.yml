services:
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - apps/backend/.env
    environment:
      AI_SERVICE_URL: http://ai-service:5000
    depends_on:
      - ai-service

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/ai-service.Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - apps/ai-service/.env
    volumes:
      - ./data/models:/app/model:ro
